name: Android Release Bundle

# Builds the Android App Bundle (.aab) automatically on every push to main, and on demand.
# Needs a few repo secrets to actually succeed and produce a Play Console upload-ready bundle:
# GOOGLE_SERVICES_JSON, RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
# RELEASE_KEY_PASSWORD - see the "Decode release keystore" and "Write google-services.json"
# steps below for where each is used.
on:
  push:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-release-bundle.yml'
  workflow_dispatch: {}

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # google-services.json is intentionally gitignored (Firebase config) - write it from a
      # repo secret instead. Required secret: GOOGLE_SERVICES_JSON (the full file content).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json

      # local.properties is also gitignored - build.gradle.kts reads AdMob/location API keys
      # from it via secret(). Missing AdMob secrets just build with blank ad unit IDs (ads won't
      # show, build still succeeds); a missing GOOGLE_SERVICES_JSON secret fails the build.
      - name: Write local.properties
        env:
          API_KEY_ADMOB: ${{ secrets.API_KEY_ADMOB }}
          API_KEY_LOCATION: ${{ secrets.API_KEY_LOCATION }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          cat <<EOF > local.properties
          API_KEY_ADMOB=$API_KEY_ADMOB
          API_KEY_LOCATION=$API_KEY_LOCATION
          ADMOB_APP_OPEN_ID=$ADMOB_APP_OPEN_ID
          ADMOB_BANNER_ID=$ADMOB_BANNER_ID
          ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID
          ADMOB_NATIVE_ID=$ADMOB_NATIVE_ID
          ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decodes the real release keystore from a base64 repo secret. If RELEASE_KEYSTORE_BASE64
      # isn't set, this step still succeeds (empty file) and build.gradle.kts's releaseKeystorePath
      # check falls back to debug signing - so the build never hard-fails over a missing keystore,
      # it just produces a non-upload-ready .aab until the secret is added.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      # Required secrets for a Play Console upload-ready .aab: RELEASE_KEYSTORE_BASE64 (the
      # .jks file, base64-encoded), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
      # RELEASE_KEY_PASSWORD - must be the SAME keystore/alias used for any previously
      # published build, or Play Console will reject the upload as a signature mismatch.
      - name: Build release App Bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease --no-daemon

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: anlikdepremler-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
