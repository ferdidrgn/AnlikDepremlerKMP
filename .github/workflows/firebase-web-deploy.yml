name: Firebase Web Hosting Deploy

# Builds the Compose Multiplatform wasmJs production bundle and deploys it to
# Firebase Hosting (anlikdeprem.web.app) on every push to main, and on demand.
on:
  push:
    branches: [ main ]
    paths:
      - 'composeApp/src/commonMain/**'
      - 'composeApp/src/wasmJsMain/**'
      - 'composeApp/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-web-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # nodejs.org has been returning 403 to GitHub Actions' IPs when Kotlin/JS tries to
      # download its own Node.js runtime from there. Installing Node here (via GitHub's own
      # infra, not nodejs.org directly) and setting CI's build.gradle.kts to skip that download
      # (download = false when $CI is set) avoids it entirely.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-wasm-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wasm-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # wasmJsBrowserDistribution's output path is composeApp/build/dist/wasmJs/productionExecutable,
      # which is exactly what firebase.json's hosting.public already points at.
      - name: Build production web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Required secret: FIREBASE_SERVICE_ACCOUNT - a Firebase Admin SDK service account key
      # (JSON), generated in Firebase Console -> Project settings -> Service accounts ->
      # "Generate new private key". Paste the whole downloaded file as the secret's value.
      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project anlikdepremler-56637 --non-interactive
