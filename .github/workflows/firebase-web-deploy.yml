name: Firebase Web Hosting Deploy

# Builds the Compose Multiplatform wasmJs production bundle and deploys it to
# Firebase Hosting (anlikdeprem.web.app) on every push to main, and on demand.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_firestore_rules:
        description: 'Deploy the reviewed Firestore rules with this release'
        required: false
        default: false
        type: boolean

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # nodejs.org has been returning 403 to GitHub Actions' IPs when Kotlin/JS tries to
      # download its own Node.js runtime from there. Installing Node here (via GitHub's own
      # infra, not nodejs.org directly) and setting CI's build.gradle.kts to skip that download
      # (download = false when $CI is set) avoids it entirely.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Kotlin/JS also tries to download Yarn through nodejs.org's Maven-style mirror (same 403
      # as Node.js itself) - install a real one from npm's registry instead, which isn't blocked.
      - name: Install Yarn
        run: npm install -g yarn

      # Binaryen (wasm-opt) is NOT installed here on purpose: Kotlin downloads its own managed
      # copy from GitHub Releases (not nodejs.org, so never actually blocked), and needs to -
      # Ubuntu's apt-packaged binaryen is too old for the optimizer flags Kotlin 2.2.20 passes.

      # Bumped to v2: the restore-keys prefix fallback below kept feeding forward a Gradle
      # cache that may have been written mid-crash by one of the many earlier failed runs while
      # debugging the wasmJs build (incomplete/corrupted stdlib klib download, etc.) - a plain
      # key change doesn't escape that, since restore-keys still matches the old prefix.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-wasm-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wasm-v2-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify source web metadata
        run: node scripts/verify-web-assets.mjs

      # wasmJsBrowserDistribution's output path is composeApp/build/dist/wasmJs/productionExecutable,
      # which is exactly what firebase.json's hosting.public already points at.
      - name: Build production web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Verify production web bundle
        run: node scripts/verify-web-assets.mjs composeApp/build/dist/wasmJs/productionExecutable

      - name: Smoke test production bundle locally
        run: node scripts/preview-web.mjs --smoke

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Required secret: FIREBASE_SERVICE_ACCOUNT - a Firebase Admin SDK service account key
      # (JSON), generated in Firebase Console -> Project settings -> Service accounts ->
      # "Generate new private key". Paste the whole downloaded file as the secret's value.
      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firebase preview channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase hosting:channel:deploy preprod --expires 7d --project anlikdepremler-56637 --non-interactive

      - name: Deploy to Firebase Hosting production
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project anlikdepremler-56637 --non-interactive

      - name: Deploy reviewed Firestore rules and TTL policies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_firestore_rules }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore --project anlikdepremler-56637 --non-interactive
