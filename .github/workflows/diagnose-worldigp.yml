name: Diagnose World IGP CORS

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: World IGP (earthquakenetwork.it) CORS check
        run: |
          curl -sS -D - -o /tmp/igp.json \
            -H "Origin: https://anlikdeprem.web.app" \
            "https://cache.earthquakenetwork.it/distquake_download_automatic21.php?pro" || true
          echo "--- body sample ---"
          head -c 1500 /tmp/igp.json
