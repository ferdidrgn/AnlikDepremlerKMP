name: Firebase Rules Check

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'scripts/firestore-rules.test.mjs'
      - '.github/workflows/firebase-rules-check.yml'
  push:
    branches: [ main, 'codex/**' ]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'scripts/firestore-rules.test.mjs'
      - '.github/workflows/firebase-rules-check.yml'

permissions:
  contents: read

jobs:
  test-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firestore rules test dependencies
        run: npm install --no-save firebase@latest @firebase/rules-unit-testing@latest firebase-tools@latest
      - name: Run Firestore Emulator rule tests
        run: npx firebase emulators:exec --only firestore --project demo-anlikdeprem "node scripts/firestore-rules.test.mjs"
